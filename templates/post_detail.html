<!DOCTYPE html>
<html long="ko">
    <head>
        <meta charset="utf-8"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'bg-color':'#FBF0E6',
                            'top-text':'#7D726A',
                            'border-color' : '#E8E0D8',
                            'bg-button' : '#FEFBF8',
                            'delete-bt': '#C65954',
                            'main-text': '#362C24',
                            'like-color':'#E68485'
                        },
                        fontFamily: {
                            jua: ['jua'],
                            gowun: ['Gowun Dodum'],
                        },
                    },
                },
            }
        </script>
    </head>
    <body>
        <div class="flex w-screen h-screen bg-bg-color justify-center items-center">
            <div class="w-[760px] flex flex-col">
                <!--상단바-->
                <div class="flex items-center justify-between mb-[24px] text-[14px] text-top-text not-italic w-full">
                    <div class="flex items-center">
                        <img
                        src="{{ url_for('static', filename='images/Vector.png') }}"
                        class="pr-[6px]">
                        목록으로
                    </div>
                    <div class="flex items-center gap-[8px]">
                        <button class="flex items-center gap-[8px] border-[1.5px] rounded-[10px] p-[8px] bg-bg-button">
                            <img src="{{ url_for('static', filename='images/pen.png') }}">
                            수정
                        </button>
                        <button onclick="alert('삭제했습니다')" class="flex items-center gap-[8px] border-[1.5px] rounded-[10px] p-[8px] bg-bg-button text-delete-bt">
                            <img src="{{ url_for('static', filename='images/delete.png') }}">
                            삭제
                        </button>
                    </div>
                </div>
                <!--메인-->
                <div class="mt-[50px]">
                    <div class="flex items-center justify-between">
                        <div class="font-jua text-[28px]">
                            제목
                        </div>
                    </div>
                    <div class="flex items-center gap-[8px] mt-[8px] text-[14px] text-top-text">
                        <div class="w-[24px] h-[24px] rounded-full bg-[#D9A9A4]"></div>
                        <span>몽글몽글</span>
                        <span>·</span>
                        <span>2026.08.24</span>
                    </div>
                </div>
                <!--대표사진-->
                <div class="w-[760px] h-[430px] rounded-[20px] mt-[27px] bg-[#D9A9A4]">
                </div>
                <!--글-->
                <div class="w-[760px] mt-[31px] text-main-text text-[15px] font-gowun">
                    안녕
                </div>
                <hr class="border-t-[2px] border-border-color mt-[36px]">
                <!--좋아요/댓글-->
                <div class="flex items-center mt-[25px] gap-[8px] mt-[16px] text-[14px] text-top-text">
                    <button id="like-btn" onclick="toggleLike()" class="flex items-center gap-[6px] rounded-full px-[12px] py-[6px] border border-border-color text-top-text">
                        <img id="like-icon" src="{{ url_for('static', filename='images/heart.png') }}" class="w-[14px] h-[14px]">
                        <span id="like-count">좋아요 24</span>
                    </button>
                    <div class="flex items-center gap-[6px] rounded-full px-[12px] py-[6px] border border-border-color">
                        <img src="{{ url_for('static', filename='images/chat.png') }}" class="w-[14px] h-[14px]">
                        <span>댓글 6</span>
                    </div>
                </div>

            </div>
        </div>
        <script>
            function toggleLike() {
                const btn = document.getElementById('like-btn');
                btn.classList.toggle('bg-like-color');
                btn.classList.toggle('border-border-color');
                btn.classList.toggle('text-white');
                btn.classList.toggle('text-top-text');
            }
        </script>
    </body>
</html>
