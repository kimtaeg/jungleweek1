<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'brand-bg': '#FEFBF8',
                            'input-bg': '#FBF8F5',
                            'input-border': '#E8E0D8',
                            'text-muted': '#7D726A',
                            'text-placeholder': '#A49D97',
                            'brand-green': '#338D6B',
                            'brand-pink': '#E68485',
                            'brand-pink-dark': '#BB565A',
                        },
                        fontFamily: {
                            jua: ['jua'],
                            gowun: ['Gowun Dodum'],
                        },
                    },
                },
            }
        </script>
    </head>
    <body>
        <div class="flex w-screen h-screen">
            <!-- 왼쪽 -->
            <div class="w-2/5 h-full">
                <img
                    src="{{ url_for('static', filename='images/Left_brand_panel.png') }}"
                    class="w-full h-full object-cover block">
            </div>
            <!-- 오른쪽 -->
            <div class="w-3/5 h-full flex items-center justify-center bg-brand-bg">
                <div class="w-[380px] flex flex-col">
                    <h1 class="text-[26px] not-italic font-jua">회원가입</h1>
                    <p class="text-sm mt-[10px] not-italic text-text-muted font-style: normal font-gowun">몇 가지만 알려주시면 바로 시작할 수 있어요</p>

                    <div class="flex gap-2 items-center  mt-[26px]">
                        <div class="w-[293.5px] px-[15px] py-3 rounded-xl border border-input-border flex items-center bg-input-bg min-w-0">
                            <img
                                src="{{ url_for('static', filename='images/SVG.png') }}"
                                class="pr-2.5">
                            <input
                                type="text"
                                placeholder="아이디"
                                class="text-sm text-text-placeholder border-none outline-none bg-transparent flex-1 min-w-0">
                        </div>
                        <button class="shrink-0 rounded-xl border-[1.5px] border-brand-green text-brand-green py-3 px-3.5 cursor-pointer bg-transparent">중복확인</button>
                    </div>

                    <div class="w-[380px] px-[15px] py-3 rounded-xl mt-3 border border-input-border flex items-center bg-input-bg min-w-0">
                            <img
                                src="{{ url_for('static', filename='images/star.png') }}"
                                class="pr-2.5">
                            <input
                                type="text"
                                placeholder="닉네임"
                                class="text-sm text-text-placeholder border-none outline-none bg-transparent flex-1 min-w-0">
                    </div>

                    <div class="w-[380px] px-[15px] py-3 rounded-xl mt-3 border border-input-border flex items-center bg-input-bg min-w-0">
                            <img
                                src="{{ url_for('static', filename='images/pwd.png') }}"
                                class="pr-2.5">
                            <input
                                type="text"
                                placeholder="비밀번호"
                                class="text-sm text-text-placeholder border-none outline-none bg-transparent flex-1 min-w-0">
                    </div>

                    <div class="w-[380px] px-[15px] py-3 rounded-xl mt-3 border border-input-border flex items-center bg-input-bg min-w-0">
                            <img
                                src="{{ url_for('static', filename='images/pwd.png') }}"
                                class="pr-2.5">
                            <input
                                type="text"
                                placeholder="비밀번호 확인"
                                class="text-sm text-text-placeholder border-none outline-none bg-transparent flex-1 min-w-0">
                    </div>

                    <label class="mt-[19.5px] block text-[13px] text-text-muted font-gowun">
                        <input type="checkbox" class="w-4 h-4 rounded-sm bg-[#E68485]">
                        <span>이용약관 및 개인정보처리방침에 동의합니다</span>
                    </label>

                    <button class="w-[380px] h-12 rounded-xl mt-5 bg-brand-pink  font-jua py-4 border-none shadow-none text-white text-base justify-center items-center">가입하기</button>

                    <p class="text-center text-[13px] mt-[20px] text-text-muted font-gowun">이미 계정이 있으신가요?<a href="#" class="font-bold text-brand-pink-dark font-gowun">로그인</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
